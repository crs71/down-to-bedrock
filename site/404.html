      text-decoration: none;
      border: 3px solid var(--pestera-3);
      box-shadow: inset 3px 3px 0 var(--piatra-3), 0 6px 0 rgb(0 0 0 / 0.4);
    }

    .gol a:focus-visible {
      outline: 3px solid var(--apus-1);
      outline-offset: 3px;
    }
