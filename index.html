      <path style="fill:var(--soare-3)" d="M5 0h6v1h-6zM3 1h2v1h-2zM11 1h2v1h-2zM2 2h1v1h-1zM13 2h1v1h-1zM1 3h1v1h-1zM14 3h1v1h-1zM1 4h1v1h-1zM14 4h1v1h-1zM0 5h1v1h-1zM15 5h1v1h-1zM0 6h1v1h-1zM15 6h1v1h-1zM0 7h1v1h-1zM15 7h1v1h-1zM0 8h1v1h-1zM15 8h1v1h-1zM0 9h1v1h-1zM15 9h1v1h-1zM0 10h1v1h-1zM15 10h1v1h-1zM1 11h1v1h-1zM14 11h1v1h-1zM1 12h1v1h-1zM14 12h1v1h-1zM2 13h1v1h-1zM13 13h1v1h-1zM3 14h2v1h-2zM11 14h2v1h-2zM5 15h6v1h-6z"/>
      <path style="fill:var(--soare-2)" d="M5 1h6v1h-6zM3 2h10v1h-10zM2 3h2v1h-2zM6 3h8v1h-8zM2 4h1v1h-1zM5 4h9v1h-9zM1 5h2v1h-2zM4 5h11v1h-11zM1 6h14v1h-14zM1 7h14v1h-14zM1 8h14v1h-14zM1 9h14v1h-14zM1 10h14v1h-14zM2 11h12v1h-12zM2 12h12v1h-12zM3 13h10v1h-10zM5 14h6v1h-6z"/>
      <path style="fill:var(--soare-1)" d="M4 3h2v1h-2zM3 4h2v1h-2zM3 5h1v1h-1z"/>
    </symbol>
    <!-- sprite:sfarsit -->
    <defs>
      <!-- Modele pentru solul din stratul 2: câte un bloc pe o celulă de 16×16. -->
      <pattern id="model-iarba" width="16" height="16" patternUnits="userSpaceOnUse"><use href="#bloc-iarba" width="16" height="16"/></pattern>
      <pattern id="model-pamant" width="16" height="16" patternUnits="userSpaceOnUse"><use href="#bloc-pamant" width="16" height="16"/></pattern>
    </defs>
  </svg>

  <aside class="adancime" aria-hidden="true">
    <span class="adancime__y">Y: 64</span>
  </aside>

  <main>
    <section class="strat strat--cer" id="cer">
      <div class="cer__scena">
        <!-- Cerul în benzi, cu tranziții în tablă de șah (dithering). Apusul apare peste zi prin opacity. -->
        <div class="cer__cer benzi" aria-hidden="true">
          <i style="--c: var(--cer-2); flex-grow: 72"></i>
          <i class="dither" style="--c: var(--cer-2); --c2: var(--cer-1); flex-grow: 5"></i>
          <i style="--c: var(--cer-1); flex-grow: 23"></i>
        </div>
        <div class="cer__cer cer__cer--apus benzi" aria-hidden="true">
          <i style="--c: var(--apus-5); flex-grow: 26"></i>
          <i class="dither" style="--c: var(--apus-5); --c2: var(--apus-4); flex-grow: 4"></i>
          <i style="--c: var(--apus-4); flex-grow: 20"></i>
          <i class="dither" style="--c: var(--apus-4); --c2: var(--apus-3); flex-grow: 4"></i>
          <i style="--c: var(--apus-3); flex-grow: 20"></i>
          <i class="dither" style="--c: var(--apus-3); --c2: var(--apus-2); flex-grow: 4"></i>
          <i style="--c: var(--apus-2); flex-grow: 16"></i>
          <i class="dither" style="--c: var(--apus-2); --c2: var(--apus-1); flex-grow: 3"></i>
          <i style="--c: var(--apus-1); flex-grow: 3"></i>
        </div>

        <div class="cer__soare" aria-hidden="true">
          <svg class="soare soare--zi"><use href="#soare"/></svg>
          <svg class="soare soare--apus"><use href="#soare"/></svg>
        </div>

        <!-- Nori pe 3 planuri: --x e poziția statică, --durata și --intarziere controlează plutirea. -->
        <div class="cer__plan cer__plan--departe" aria-hidden="true">
          <svg class="nor nor--mic" style="--y: 10%; --x: 6vw; --durata: 170s; --intarziere: -20s"><use href="#nor-mic"/></svg>
          <svg class="nor nor--mediu" style="--y: 20%; --x: 58vw; --durata: 190s; --intarziere: -95s"><use href="#nor-mediu"/></svg>
          <svg class="nor nor--mic" style="--y: 32%; --x: 34vw; --durata: 160s; --intarziere: -130s"><use href="#nor-mic"/></svg>
          <svg class="nor nor--mic" style="--y: 44%; --x: 80vw; --durata: 180s; --intarziere: -60s"><use href="#nor-mic"/></svg>
        </div>
        <div class="cer__plan cer__plan--mijloc" aria-hidden="true">
          <svg class="nor nor--mediu" style="--y: 14%; --x: 70vw; --durata: 120s; --intarziere: -10s"><use href="#nor-mediu"/></svg>
          <svg class="nor nor--mare" style="--y: 38%; --x: 4vw; --durata: 135s; --intarziere: -70s"><use href="#nor-mare"/></svg>
          <svg class="nor nor--mic" style="--y: 58%; --x: 46vw; --durata: 110s; --intarziere: -45s"><use href="#nor-mic"/></svg>
        </div>
        <div class="cer__plan cer__plan--aproape" aria-hidden="true">
          <svg class="nor nor--mare" style="--y: 66%; --x: 52vw; --durata: 80s; --intarziere: -30s"><use href="#nor-mare"/></svg>
          <svg class="nor nor--mediu" style="--y: 84%; --x: -4vw; --durata: 90s; --intarziere: -75s"><use href="#nor-mediu"/></svg>
        </div>

        <h1 class="titlu">
          <span class="vizual-ascuns">Coborârea</span>
          <span class="titlu__blocuri" aria-hidden="true">
            <svg class="titlu__bloc"><use href="#litera-c"/></svg>
            <svg class="titlu__bloc"><use href="#litera-o"/></svg>
            <svg class="titlu__bloc"><use href="#litera-b"/></svg>
            <svg class="titlu__bloc"><use href="#litera-o"/></svg>
            <svg class="titlu__bloc"><use href="#litera-r"/></svg>
            <svg class="titlu__bloc"><use href="#litera-a-circumflex"/></svg>
            <svg class="titlu__bloc"><use href="#litera-r"/></svg>
            <svg class="titlu__bloc"><use href="#litera-e"/></svg>
            <svg class="titlu__bloc"><use href="#litera-a"/></svg>
          </span>
        </h1>

        <p class="cer__indemn">Derulează ca să cobori <span class="cer__sageata" aria-hidden="true">↓</span></p>
      </div>
    </section>

    <section class="strat strat--suprafata" id="suprafata">
      <!-- Fără animație, fereastra se derulează orizontal manual (de aceea tabindex); cu GSAP, e fixată și se mișcă singură. -->
      <div class="sup__fereastra" role="region" aria-label="Peisajul suprafeței" tabindex="0">
        <h2 class="sup__titlu">Suprafața</h2>

        <div class="sup__scutura">
          <div class="sup__lume">
            <div class="sup__cer benzi" aria-hidden="true">
              <i style="--c: var(--apus-5); flex-grow: 20"></i>
              <i class="dither" style="--c: var(--apus-5); --c2: var(--apus-4); flex-grow: 4"></i>
              <i style="--c: var(--apus-4); flex-grow: 16"></i>
              <i class="dither" style="--c: var(--apus-4); --c2: var(--apus-3); flex-grow: 4"></i>
              <i style="--c: var(--apus-3); flex-grow: 18"></i>
              <i class="dither" style="--c: var(--apus-3); --c2: var(--apus-2); flex-grow: 4"></i>
              <i style="--c: var(--apus-2); flex-grow: 34"></i>
            </div>
            <svg class="sup__soare" aria-hidden="true"><use href="#soare"/></svg>

            <!-- Planul îndepărtat: un deal și copaci mici, mai întunecați, care se mișcă mai încet (parallax). -->
            <div class="sup__departe" aria-hidden="true">
              <svg class="sup__copac-departe" style="--x: 4vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 22vw"><use href="#copac-2"/></svg>
              <svg class="sup__copac-departe" style="--x: 31vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 57vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 83vw"><use href="#copac-2"/></svg>
              <svg class="sup__copac-departe" style="--x: 96vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 128vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 151vw"><use href="#copac-2"/></svg>
              <svg class="sup__copac-departe" style="--x: 188vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac-departe" style="--x: 214vw"><use href="#copac-3"/></svg>
            </div>

            <!-- Pista: 300vw, deplasată spre stânga odată cu scroll-ul. Copacii cresc când intră în ecran. -->
            <div class="sup__pista" aria-hidden="true">
              <svg class="sup__sol" viewBox="0 0 16 64" preserveAspectRatio="xMinYMin meet">
                <rect width="100000" height="16" fill="url(#model-iarba)"/>
                <rect y="16" width="100000" height="48" fill="url(#model-pamant)"/>
              </svg>

              <svg class="sup__copac" style="--x: 14vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 42vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 78vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 112vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 146vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 184vw"><use href="#copac-3"/></svg>
              <svg class="sup__copac" style="--x: 216vw"><use href="#copac-3"/></svg>

              <svg class="sup__crater"><use href="#crater"/></svg>
              <div class="sup__creeper">
                <svg><use href="#creeper"/></svg>
                <i class="sup__creeper-alb"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- La finalul plonjării în crater, ecranul ajunge la culoarea de început a stratului de piatră. -->
        <div class="sup__intuneric" aria-hidden="true"></div>
      </div>
    </section>

    <section class="strat strat--piatra" id="piatra">
      <h2>Pământ și piatră</h2>
    </section>

    <section class="strat strat--pestera" id="pestera">
      <h2>Peștera</h2>
    </section>

    <section class="strat strat--mina" id="mina">
      <h2>Mina abandonată</h2>
    </section>

    <section class="strat strat--nether" id="nether">
      <h2>Nether</h2>
    </section>

    <section class="strat strat--bedrock" id="bedrock">
      <h2>Bedrock</h2>
      <a class="respawn" href="#cer">Respawn</a>
    </section>
  </main>
</body>
</html>
