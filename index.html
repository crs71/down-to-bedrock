<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coborârea</title>
  <meta name="description" content="O coborâre prin straturile unei lumi din blocuri, de la cer până la bedrock.">
  <link rel="preload" href="assets/fonts/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <!-- Fiecare strat adaugă aici css/straturi/NN-nume.css, după base.css. -->

  <!-- GSAP + ScrollTrigger (versiune fixată, cu SRI). Fără ele, pagina rămâne pe varianta statică. -->

  <script src="js/main.js" defer></script>
  <!-- Fiecare strat adaugă aici js/straturi/NN-nume.js (defer), după main.js. -->

  <aside class="adancime" aria-hidden="true">

  <main>

    <section class="strat strat--suprafata" id="suprafata">

    </section>

    <section class="strat strat--piatra" id="piatra">
      <h2>Pământ și piatră</h2>

    <section class="strat strat--pestera" id="pestera">

    </section>

    <section class="strat strat--mina" id="mina">

    <section class="strat strat--nether" id="nether">
